<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06040f">
<meta name="description" content="2027 정미년(丁未年) 12띠 운세 · 연애운 · 금전운 · 타로 3카드 — 전 연령대">
<title>2027 정미년 운세 · 띠별 운세와 타로</title>
<style>
:root{
  --bg:#06040f;--bg2:#0d0820;
  --gold:#f0c060;--gold2:#c89020;--vio:#c084fc;--vio2:#7c3aed;
  --rose:#fb7185;--ok:#4ade80;--warn:#fb923c;
  --tx:#f0eeff;--sub:#9890c0;--line:rgba(240,192,96,.22);
  --r:env(safe-area-inset-right,0px);--l:env(safe-area-inset-left,0px);
  --t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);
  --font:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;height:100dvh}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── 단계 슬라이드 ── */
.step{
  position:fixed;inset:0;
  transform:translateX(100%);
  transition:transform .42s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;overflow-x:hidden;
  z-index:1;
  -webkit-overflow-scrolling:touch;
}
.step.active{transform:translateX(0)}
.step.prev{transform:translateX(-28%)}

/* ── 공통 헤더 ── */
.step-hdr{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:calc(var(--t) + 14px) 20px 14px;
  background:linear-gradient(var(--bg) 70%,transparent);
}
.back-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:var(--tx);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.back-btn:active{background:rgba(255,255,255,.12)}
.step-dots{display:flex;gap:7px;align-items:center;flex:1;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.3s}
.dot.on{width:22px;border-radius:4px;background:var(--gold)}
.hdr-side{width:38px;flex-shrink:0}

/* ── 단계1: 인트로 ── */
#s1{background:var(--bg)}
.s1-wrap{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--t) + 20px) 20px calc(var(--b) + 24px);
}
.moon-wrap{position:relative;margin:12px 0 20px;flex-shrink:0}
.moon{
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#fff9e8 5%,#f5d87a 40%,#c89020 75%,#7a5010 100%);
  box-shadow:0 0 50px rgba(240,192,96,.5),0 0 100px rgba(192,132,252,.3);
  animation:pulse 6s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
  font:900 46px serif;color:rgba(80,52,10,.5);position:relative;z-index:1
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 50px rgba(240,192,96,.5),0 0 100px rgba(192,132,252,.3)}
  50%{box-shadow:0 0 80px rgba(240,192,96,.7),0 0 160px rgba(192,132,252,.5)}
}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(240,192,96,.28);animation:spin 22s linear infinite}
.ring1{inset:-18px}.ring2{inset:-36px;animation-duration:38s;animation-direction:reverse;border-color:rgba(192,132,252,.18)}
.ring1::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold);transform:translateX(-50%)}
@keyframes spin{to{transform:rotate(360deg)}}

.s1-ttl{font-size:clamp(32px,9vw,52px);font-weight:900;letter-spacing:-2px;line-height:1.05;text-align:center;
  background:linear-gradient(135deg,var(--gold) 0%,#fff8dc 50%,var(--vio) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.s1-sub{font-size:14px;color:var(--sub);text-align:center;margin-bottom:16px}
.year-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.year-chip{font-size:12px;border:1px solid rgba(240,192,96,.28);border-radius:999px;padding:5px 13px;color:var(--gold);background:rgba(240,192,96,.07)}

.pick-label{font:800 12px var(--font);color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;text-align:center}

/* ── 띠 그리드 ── */
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:500px}
.zbtn{
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  border-radius:16px;padding:12px 4px;color:var(--tx);cursor:pointer;
  text-align:center;transition:.18s;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.zbtn .em{font-size:36px;line-height:1}
.zbtn .nm{font-size:13px;font-weight:900}
.zbtn .yrs{font-size:9.5px;color:var(--sub);line-height:1.4}
.zbtn:active{background:rgba(255,255,255,.1);transform:scale(.95)}
@media(max-width:360px){.zgrid{grid-template-columns:repeat(3,1fr)}}

/* ── 단계2: 운세 결과 ── */
#s2{background:var(--bg)}
.s2-wrap{padding:0 18px calc(var(--b) + 100px)}

.z-hero{
  display:flex;align-items:center;gap:16px;
  padding:20px 18px;
  background:linear-gradient(135deg,rgba(240,192,96,.12),rgba(192,132,252,.07));
  border:1px solid rgba(240,192,96,.25);border-radius:20px;
  margin-bottom:18px
}
.z-hero .z-em{font-size:72px;line-height:1;flex-shrink:0}
.z-hero h2{font-size:22px;font-weight:900;margin-bottom:4px}
.z-rel{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:8px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid}
.tg{background:rgba(74,222,128,.1);color:#4ade80;border-color:rgba(74,222,128,.28)}
.tw{background:rgba(251,145,70,.1);color:#fb923c;border-color:rgba(251,145,70,.28)}
.tn{background:rgba(255,255,255,.05);color:var(--sub);border-color:rgba(255,255,255,.12)}

.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:420px){.meters{grid-template-columns:repeat(4,1fr)}}
.mi{background:rgba(255,255,255,.04);border-radius:14px;padding:14px 10px;text-align:center}
.mi-lbl{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.mi-score{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:7px;line-height:1}
.mi-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.mi-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .8s .1s ease}

.ztabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ztabs button{flex:1;min-width:60px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:var(--sub);border-radius:11px;padding:9px 4px;font:700 12px var(--font);cursor:pointer;transition:.15s}
.ztabs button.on{background:rgba(192,132,252,.2);color:#fff;border-color:var(--vio)}
.ztab-content{font-size:15px;line-height:1.75;display:none;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px;margin-bottom:14px}
.ztab-content.on{display:block;animation:fadeup .3s}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}

.z-advice{padding:14px 16px;background:rgba(240,192,96,.07);border-left:3px solid var(--gold);
  border-radius:0 13px 13px 0;font-size:14px;margin-bottom:12px}
.z-advice b{color:var(--gold)}
.lucky-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.lucky-pill{font-size:12px;border:1px solid rgba(240,192,96,.22);border-radius:999px;padding:4px 12px;
  color:#f3dea4;background:rgba(240,192,96,.05)}
.yrs-note{font-size:11.5px;color:var(--sub);margin-bottom:18px}

/* ── 하단 CTA 바 ── */
.cta-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:14px 18px calc(var(--b) + 14px);
  background:linear-gradient(transparent 0%,var(--bg) 35%);
  display:flex;gap:8px;z-index:5
}
.btn{border:0;border-radius:14px;padding:14px 18px;font:800 15px var(--font);cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-pri{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#2a1800;flex:1}
.btn-pri:active{filter:brightness(1.1)}
.btn-sec{background:rgba(255,255,255,.08);color:var(--tx);flex:none;padding:14px 16px}
.btn-sec:active{background:rgba(255,255,255,.14)}

/* ── 단계3: 타로 ── */
#s3{background:var(--bg)}
.s3-wrap{padding:0 18px calc(var(--b) + 100px)}
.tarot-intro{font-size:14px;color:var(--sub);text-align:center;margin-bottom:20px;line-height:1.65}

.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;perspective:800px}
.plbl{font-size:10px;color:var(--sub);font-weight:800;letter-spacing:.05em;text-align:center;margin-bottom:6px}
.tcard{position:relative;aspect-ratio:2/3.2;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.tcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:radial-gradient(ellipse at 50% 50%,#2d1b8a 0%,#0e0636 100%);
  border:2px solid rgba(240,192,96,.45);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold)}
.back::before{content:"";position:absolute;inset:7px;border:1px solid rgba(240,192,96,.25);border-radius:9px;
  background:repeating-conic-gradient(from 45deg,rgba(192,132,252,.05) 0 22.5deg,transparent 22.5deg 45deg)}
.back span{position:relative;text-shadow:0 0 18px var(--gold)}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#fef9e8,#f0e0a8);color:#3a2800;
  border:2px solid rgba(192,144,32,.8);display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:8px 6px}
.front .fn{font:800 10px serif;letter-spacing:1px}
.front .fs{font-size:clamp(22px,7vw,36px);line-height:1;margin:2px 0}
.front .fnm{font:900 clamp(9px,2.5vw,12px)/1.2 var(--font);text-align:center}
.front .fko{font-size:8.5px;color:#8b6830;margin-top:1px}
.front.rev .fs,.front.rev .fn{transform:rotate(180deg)}
.front .fdir{position:absolute;top:5px;right:5px;font-size:8px;font-weight:900;border-radius:4px;padding:1px 4px}
.front:not(.rev) .fdir{background:#4ade80;color:#0a2a10}
.front.rev .fdir{background:#fb7185;color:#3a0010}

.tread{margin-top:4px;display:none}
.tread.on{display:block;animation:fadeup .4s}
.tri{padding:14px 16px;border-radius:14px;margin:10px 0;
  background:rgba(255,255,255,.04);border-left:3px solid var(--gold)}
.tri .tpos{font-size:10.5px;color:var(--sub);font-weight:800;letter-spacing:.04em}
.tri .tcn{font-size:16px;font-weight:900;margin:4px 0 3px}
.tri .tmn{font-size:14px;line-height:1.65}
.tri .ty27{font-size:12.5px;color:var(--vio);margin-top:4px;font-style:italic}

.share-wrap{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.src-note{font-size:12px;color:#5a5898;border-top:1px dashed rgba(255,255,255,.07);
  margin-top:14px;padding-top:12px;line-height:1.65}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(var(--b) + 100px);transform:translateX(-50%) translateY(12px);
  background:#fff;color:#111;border-radius:12px;padding:11px 20px;font:700 13px var(--font);
  opacity:0;transition:.25s;z-index:200;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 반응형 ── */
@media(min-width:600px){
  .s1-wrap,.s2-wrap,.s3-wrap{max-width:520px;margin:0 auto}
  .s2-wrap,.s3-wrap{padding-left:0;padding-right:0}
  .cta-bar{max-width:520px;left:50%;transform:translateX(-50%);right:auto;width:520px;border-radius:20px 20px 0 0}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="toast" id="toast"></div>

<!-- ══ STEP 1: 띠 선택 ══ -->
<div class="step active" id="s1">
  <div class="s1-wrap">
    <div class="moon-wrap">
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <div class="moon" aria-hidden="true">未</div>
    </div>
    <p class="s1-ttl">2027 정미년<br>운세</p>
    <p class="s1-sub">丁未年 · 양띠 해 · 화생토의 기운</p>
    <div class="year-chips">
      <span class="year-chip">🐑 양(羊)의 해</span>
      <span class="year-chip">🔥 불이 흙을 살리는 해</span>
      <span class="year-chip">전 연령대</span>
    </div>
    <p class="pick-label">내 띠를 선택하세요</p>
    <div class="zgrid" id="zgrid"></div>
    <p style="font-size:11.5px;color:var(--sub);margin-top:14px;text-align:center;line-height:1.65">
      띠는 음력 설(입춘) 기준 — 1~2월생은 앞 해 띠일 수 있어요
    </p>
  </div>
</div>

<!-- ══ STEP 2: 운세 결과 ══ -->
<div class="step" id="s2">
  <div class="step-hdr">
    <button class="back-btn" onclick="goStep(1)" aria-label="뒤로">←</button>
    <div class="step-dots">
      <div class="dot on"></div>
      <div class="dot on"></div>
      <div class="dot"></div>
    </div>
    <div class="hdr-side"></div>
  </div>
  <div class="s2-wrap" id="s2wrap"></div>
  <div class="cta-bar" id="cta2">
    <button class="btn btn-pri" onclick="goStep(3)">타로 뽑기 →</button>
    <button class="btn btn-sec" onclick="shareResult()">📤</button>
  </div>
</div>

<!-- ══ STEP 3: 타로 ══ -->
<div class="step" id="s3">
  <div class="step-hdr">
    <button class="back-btn" onclick="goStep(2)" aria-label="뒤로">←</button>
    <div class="step-dots">
      <div class="dot on"></div>
      <div class="dot on"></div>
      <div class="dot on"></div>
    </div>
    <div class="hdr-side"></div>
  </div>
  <div class="s3-wrap">
    <p class="tarot-intro">마음속으로 '2027년의 나'를 떠올리고<br>카드를 선택하세요. 78장 덱에서 무작위 3장.</p>
    <div class="spread" id="spread"></div>
    <div style="text-align:center;margin-bottom:16px">
      <button class="btn btn-pri" id="draw" style="width:100%;max-width:280px">🔮 카드 3장 뽑기</button>
      <button class="btn btn-sec" id="redraw" style="display:none;margin-top:8px">↺ 다시 뽑기</button>
    </div>
    <div class="tread" id="tread"></div>
    <div class="share-wrap" id="share3" style="display:none">
      <button class="btn btn-pri" onclick="shareResult()" style="flex:1">📤 결과 공유</button>
      <button class="btn btn-sec" onclick="copyResult()">📋</button>
      <button class="btn btn-sec" onclick="goStep(1)">처음부터</button>
    </div>
    <p class="src-note">타로는 상징을 통해 스스로를 돌아보는 도구입니다. 개인 사주는 월·일·시까지 보아야 하며, 중요한 결정은 전문가와 상의하세요. 참고: 연해자평·적천수·삼명통회</p>
  </div>
</div>

   all:"귀문(鬼門)은 직관과 감수성이 날카로워지는 관계입니다. 남들이 못 보는 기회를 먼저 알아채지만, 그만큼 생각이 많아지고 쉽게 지칠 수 있어요.",

function buildS2(z){
  const tags=z.tags.map(([cl,nm])=>`<span class="tag t${cl||"n"}">${nm}</span>`).join("");
  const ms=[["🌟 총운",z.score.all],["💞 연애",z.score.love],["💰 금전",z.score.money],["📈 투자",z.score.invest]];
  $("s2wrap").innerHTML=`
    <div class="z-hero">
      <div class="z-em">${z.em}</div>
      <div>
        <h2>${z.an}띠 (${z.gz})</h2>
        <div class="z-rel">정미년과: ${z.rel}</div>
        <div class="tags">${tags}</div>
      </div>
    </div>
    <div class="yrs-note">출생연도 (음력 설 기준): ${z.yrs}</div>
    <div class="meters" id="meters">
      ${ms.map(([l,sc],idx)=>`<div class="mi"><div class="mi-lbl">${l}</div><div class="mi-score" id="ms${idx}">${sc}/5</div><div class="mi-bar"><div class="mi-fill" id="mf${idx}" data-val="${sc}"></div></div></div>`).join("")}
    </div>
    <div class="ztabs" id="ztabs">
      <button class="on" data-tab="all">🌟 종합</button>
      <button data-tab="love">💞 연애</button>
      <button data-tab="money">💰 금전</button>
      <button data-tab="invest">📈 투자</button>
    </div>
    <div class="ztab-content on" id="tc-all">${esc(z.all)}</div>
    <div class="ztab-content" id="tc-love">${esc(z.love)}</div>
    <div class="ztab-content" id="tc-money">${esc(z.money)}</div>
    <div class="ztab-content" id="tc-invest">${esc(z.invest)}</div>
    <div class="z-advice"><b>✨ 한 줄 조언</b> — ${esc(z.tip)}</div>
    <div class="lucky-wrap">${z.lucky.map(l=>`<span class="lucky-pill">🍀 ${esc(l)}</span>`).join("")}</div>
  `;
  $("ztabs").addEventListener("click",e=>{
    const b=e.target.closest("[data-tab]");if(!b)return;
    $("ztabs").querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".ztab-content").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");$("tc-"+b.dataset.tab).classList.add("on");
  });
}

function animateMeters(){
  setTimeout(()=>{
    for(let i=0;i<4;i++){
      const fill=$("mf"+i);
      if(fill) fill.style.width=(+fill.dataset.val/5*100)+"%";
    }
  },80);
}

// ── 타로 ──
const POS=["과거 · 2026","현재 · 지금","미래 · 2027"];
let drawn=null;

function renderSpread(cards){
  $("spread").innerHTML=POS.map((p,i)=>{
    const c=cards&&cards[i];
    return`<div class="slot"><div class="plbl">${p}</div><div class="tcard" data-i="${i}"><div class="face back"><span>✦</span></div>${c?`<div class="face front ${c.rev?"rev":""}"><span class="fdir">${c.rev?"역":"정"}</span><div class="fn">${c.card.num}</div><div class="fs">${c.card.sym}</div><div class="fnm">${esc(c.card.ko)}</div><div class="fko">${esc(c.card.en)}</div></div>`:""}</div></div>`;
  }).join("");
}

function drawThree(){
  const idx=DECK.map((_,j)=>j);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx.slice(0,3).map(i=>({card:DECK[i],rev:Math.random()<.35}));
}

function doDraw(){
  drawn=drawThree();renderSpread(drawn);
  $("tread").classList.remove("on");
  $("draw").style.display="none";$("redraw").style.display="inline-flex";
  $("share3").style.display="none";
  document.querySelectorAll(".tcard").forEach((el,i)=>setTimeout(()=>el.classList.add("flip"),300+i*620));
  setTimeout(()=>{
    $("tread").innerHTML=drawn.map((c,i)=>`<div class="tri"><div class="tpos">${POS[i]}</div><div class="tcn">${c.card.sym} ${esc(c.card.ko)} <small style="color:var(--sub);font-weight:400">${c.rev?"역방향":"정방향"}</small></div><div class="tmn">${esc(c.rev?c.card.rev:c.card.up)}</div>${c.card.y27&&!c.rev&&i===2?`<div class="ty27">✦ ${esc(c.card.y27)}</div>`:""}</div>`).join("")+
      `<div class="src-note">타로는 상징을 통해 스스로를 돌아보는 도구입니다. 개인 사주는 월·일·시까지 보아야 하며, 중요한 결정은 전문가와 상의하세요.</div>`;
    $("tread").classList.add("on");
    $("share3").style.display="flex";
  },300+3*620+300);
}
$("draw").onclick=doDraw;$("redraw").onclick=doDraw;
renderSpread(null);

// ── 공유 ──
const stars5=n=>"★".repeat(n)+"☆".repeat(5-n);
function resultText(){
  let t="🔮 2027 정미년 운세\n";
  if(picked) t+=`\n${picked.em} ${picked.an}띠 (${picked.rel})\n총운 ${stars5(picked.score.all)} · 연애 ${stars5(picked.score.love)} · 금전 ${stars5(picked.score.money)}\n"${picked.tip}"\n`;
  if(drawn) t+=`\n🃏 타로 3장\n${drawn.map((c,i)=>`${POS[i]}: ${c.card.ko}(${c.rev?"역":"정"})`).join("\n")}\n`;
  return t+"\nhttps://hongfe.github.io/fortune2027/";
}
async function copyResult(){
  const t=resultText();
  try{await navigator.clipboard.writeText(t);toast("복사했어요! 카톡에 붙여 넣어 보세요 🎉")}
  catch(e){toast(t.slice(0,60)+"...")}
}
function shareResult(){
  if(navigator.share) navigator.share({title:"2027 정미년 운세",text:resultText()}).catch(()=>{});
  else copyResult();
}
window.shareResult=shareResult;window.copyResult=copyResult;

// ── 복원 ──
try{const z=localStorage.getItem("f27_z");if(z!==null&&ZODIAC[+z]){picked=ZODIAC[+z];buildS2(ZODIAC[+z])}}catch(e){}
</script>
